name: NextGen Project CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Syntax Check Backend Modules (Weeks 13 - 15)
      run: |
        node -c week13/server.js
        node -c week14/server.js
        node -c week15/server.js

    - name: Build Week 12 (Production Deployment Hub)
      run: |
        cd week12
        npm ci --prefer-offline || npm install
        npm run build
